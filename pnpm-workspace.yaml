packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
  - '@cloudflare/workers-types@5.20261018.1'

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.0
  http-cache-semantics: 4.3.0
  fast-uri@^3.0.0: 3.1.9
  undici@^6.0.0: 6.29.1
  undici@^7.0.0: 7.30.1
  undici@^8.0.0: 8.12.2
  zod@^4.0.0: 4.6.6
