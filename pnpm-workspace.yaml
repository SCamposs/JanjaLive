packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
  - '@cloudflare/workers-types@5.20261018.1'

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.0
  http-cache-semantics: 4.3.0
